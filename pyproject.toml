[project]
name = "ataskaitos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "fastapi>=0.121.0",
    "markitdown[docx, pdf]>=0.1.3",
    "pandas>=2.3.3",
    "pydantic-ai-slim[anthropic,google,openai]>=1.8.0",
    "pydantic-evals>=1.8.0",
    "pydantic-settings>=2.11.0",
    "pypdf>=6.1.3",
    "pytest>=9.0.1",
    "python-multipart>=0.0.20",
    "reportlab>=4.2.5",
    "scikit-learn>=1.7.2",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ataskaitos*", "straipsniai*"]

[tool.ruff]
line-length = 120
