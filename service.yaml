apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ataskaitos
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Auto-scaling configuration (kept at 1 — see docs/scaling.md)
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        # Startup CPU boost
        run.googleapis.com/startup-cpu-boost: 'true'
        # Cloud SQL connector (unix socket at /cloudsql/<connection name>)
        run.googleapis.com/cloudsql-instances: innate-client-508813-e6:europe-west1:ataskaitos-prod
    spec:
      # Dedicated runtime identity (not the default compute service account)
      serviceAccountName: ataskaitos-run@innate-client-508813-e6.iam.gserviceaccount.com
      containers:
      - image: europe-west1-docker.pkg.dev/innate-client-508813-e6/cloud-run-source-deploy/ataskaitos:latest
        ports:
        - containerPort: 8080
          name: http1
        env:
        # Environment mode (development/production)
        - name: ENV
          value: "production"
        # File storage: Google Cloud Storage (container disk does not survive restarts)
        - name: USE_GCS
          value: "true"
        - name: GCS_BUCKET_NAME
          value: "ataskaitos-prod-687594214295"
        - name: GCS_PROJECT_ID
          value: "innate-client-508813-e6"
        # OpenAI API Key (set via Secret Manager)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: latest
        # API key — still injected, no longer read by the app
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: ataskaitos-api-key
              key: latest
        # PostgreSQL connection string (set via Secret Manager)
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ataskaitos-database-url
              key: latest
        # JWT signing secret (set via Secret Manager)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ataskaitos-jwt-secret
              key: latest
        # Resource limits
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
        # Startup probe — must hit /api/health, not /health (see docs/deployment.md)
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 3
      # Request timeout (max: 3600s for Cloud Run)
      timeoutSeconds: 300
